<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPP-DL Generator - SMP NEGERI 1 SAKETI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Lora', serif; }
        
        /* Gaya khusus untuk tampilan cetak agar menyerupai dokumen resmi */
        @media print {
            @page { margin: 1.5cm; size: A4; }
            body { background: white !important; font-size: 10pt; }
            .print-hidden { display: none !important; }
            .print-m-0 { margin: 0 !important; }
            .print-p-0 { padding: 0 !important; }
            .rpp-container { width: 100% !important; border: 1px solid #000 !important; padding: 20px !important; }
            .no-shadow { box-shadow: none !important; }
        }

        .rpp-table td { border: 1px solid #e2e8f0; padding: 8px; vertical-align: top; }
        @media print { .rpp-table td { border: 1px solid #000; } }
        
        /* Animasi loading sederhana */
        .loader {
            border-top-color: #4f46e5;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <!-- React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Word Export Library -->
    <script src="https://cdn.jsdelivr.net/gh/evidenceprime/html-docx-js@master/dist/html-docx.js"></script>

    <script type="text/babel">
        const { useState, useRef } = React;
        
        // Komponen Ikon SVG (Inline)
        const Icon = ({ name, size = 18, className = "" }) => {
            const icons = {
                fileText: (
                    <>
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </>
                ),
                send: (
                    <>
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </>
                ),
                key: (
                    <>
                        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778zM12 7l.34 1.59L14 9l1.59.34L17 11l1.59.34L20 13l1.59.34L22 15"/>
                    </>
                ),
                printer: (
                    <>
                        <polyline points="6 9 6 2 18 2 18 9"/>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                        <rect x="6" y="14" width="12" height="8"/>
                    </>
                ),
                download: (
                    <>
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                    </>
                ),
                book: (
                    <>
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </>
                ),
                alert: (
                    <>
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                    </>
                )
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        function App() {
            const [loading, setLoading] = useState(false);
            const [generatedRPP, setGeneratedRPP] = useState(null);
            const [error, setError] = useState(null);
            const [userApiKey, setUserApiKey] = useState("");
            const rppRef = useRef(null);

            const [formData, setFormData] = useState({
                mataPelajaran: "Informatika",
                satuanPendidikan: "SMP NEGERI 1 SAKETI",
                faseKelas: "D / VIII",
                semester: "GENAP",
                tahunPelajaran: "2025/2026",
                topik: "Analisis Data Terstruktur dengan Lembar Kerja",
                jumlahPertemuan: "2",
                alokasiWaktu: "2 JP x Pertemuan",
                cpText: `Berpikir Komputasonal : murid mampu menerapkan berpikir komputasional untuk problem dalam kehidupan sehari-hari; Literasi Digital : murid mampu memahami pemanfaatan perangkat teknologi pengolah lembar kerja.`
            });

            const generateRPP = async () => {
                if (!userApiKey) {
                    setError("API Key Gemini wajib diisi agar sistem dapat bekerja.");
                    return;
                }

                setLoading(true);
                setError(null);

                const systemPrompt = `Anda adalah pakar Kurikulum Merdeka dan Pembelajaran Mendalam (Deep Learning). 
                Buatlah RPP berdasarkan format template PDF RPP-DL berikut:
                
                1. IDENTITAS: Nama Sekolah, Kelas, Mata Pelajaran, Alokasi Waktu.
                2. DIMENSI PROFIL LULUSAN (DPL 1-8): Cantumkan list DPL (1. Keimanan, 2. Kreativitas, 3. Penalaran Kritis, 4. Kemandirian, 5. Kolaborasi, 6. Kewargaan, 7. Kesehatan, 8. Komunikasi). Berikan tanda [x] pada yang relevan.
                3. DESAIN PEMBELAJARAN: CP, Lintas Disiplin Ilmu, Tujuan Pembelajaran, Topik, Praktik Pedagogis (6C), Kemitraan, Lingkungan, Pemanfaatan Digital.
                4. LANGKAH PEMBELAJARAN (Buat mendetail untuk ${formData.jumlahPertemuan} pertemuan):
                   - Awal: Berkesan & Bermakna.
                   - Inti: 
                     A. Memahami (Berkesadaran, Bermakna)
                     B. Mengaplikasi (Bermakna, Menggembirakan): Sertakan poin Stimulus, Identifikasi Masalah, Data, Pembuktian, Simpulan, Komunikasi.
                     C. Merefleksi (Berkesadaran, Bermakna).
                   - Penutup.
                5. ASESMEN: Awal, Proses, dan Akhir.
                
                Gunakan format Markdown yang rapi dengan tabel jika diperlukan.`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${userApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Buat RPP Lengkap: Topik ${formData.topik}, ${formData.jumlahPertemuan} Pertemuan, Sekolah ${formData.satuanPendidikan}. CP: ${formData.cpText}` }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    
                    const content = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (content) setGeneratedRPP(content);
                    else throw new Error("Gagal menerima hasil dari AI. Coba lagi.");
                } catch (err) {
                    setError("Gagal: " + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const downloadWord = () => {
                if (!rppRef.current) return;
                
                // Menambahkan styling khusus untuk ekspor Word
                const contentHtml = `
                    <!DOCTYPE html>
                    <html>
                        <head>
                            <meta charset="utf-8">
                            <style>
                                body { font-family: 'Times New Roman', serif; line-height: 1.5; }
                                h1, h2, h3 { text-transform: uppercase; text-align: center; }
                                table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
                                td, th { border: 1px solid black; padding: 5px; vertical-align: top; }
                                .header-center { text-align: center; }
                            </style>
                        </head>
                        <body>
                            ${rppRef.current.innerHTML}
                        </body>
                    </html>
                `;

                const converted = htmlDocx.asBlob(contentHtml);
                const url = URL.createObjectURL(converted);
                const link = document.createElement('a');
                link.href = url;
                link.download = `RPP_${formData.topik.replace(/\s+/g, '_')}.docx`;
                link.click();
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-6xl mx-auto">
                        <header className="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-6 print-hidden">
                            <div className="flex items-center gap-3">
                                <div className="p-3 bg-indigo-600 rounded-xl text-white shadow-lg">
                                    <Icon name="book" size={28} />
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold text-slate-800">RPP-DL Generator</h1>
                                    <p className="text-slate-500 text-sm">Pembelajaran Mendalam (Deep Learning) - SMPN 1 SAKETI</p>
                                </div>
                            </div>
                            {generatedRPP && (
                                <div className="flex gap-2">
                                    <button onClick={downloadWord} className="px-5 py-2.5 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-all shadow-md flex items-center gap-2 font-medium">
                                        <Icon name="download" /> Unduh Word (.docx)
                                    </button>
                                    <button onClick={() => window.print()} className="px-5 py-2.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-all shadow-md flex items-center gap-2 font-medium">
                                        <Icon name="printer" /> Cetak RPP Resmi
                                    </button>
                                </div>
                            )}
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            {/* Panel Kiri: Konfigurasi */}
                            <aside className="lg:col-span-4 space-y-6 print-hidden">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h2 className="text-lg font-semibold mb-4 flex items-center gap-2 text-indigo-600">
                                        <Icon name="key" /> Keamanan API
                                    </h2>
                                    <div className="mb-6">
                                        <label className="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">Gemini API Key</label>
                                        <input 
                                            type="password" 
                                            placeholder="Tempel API Key di sini..." 
                                            value={userApiKey}
                                            onChange={(e) => setUserApiKey(e.target.value)}
                                            className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm" 
                                        />
                                        <div className="mt-2 p-2 bg-amber-50 rounded-lg flex gap-2 items-start border border-amber-100">
                                            <Icon name="alert" size={14} className="text-amber-500 mt-0.5 shrink-0" />
                                            <p className="text-[10px] text-amber-700 leading-tight italic">
                                                Kunci Anda tidak akan disimpan di server. Anda bisa mendapatkan kunci gratis di Google AI Studio.
                                            </p>
                                        </div>
                                    </div>

                                    <h2 className="text-lg font-semibold mb-4 flex items-center gap-2 text-indigo-600 border-t pt-4">
                                        <Icon name="fileText" /> Identitas RPP
                                    </h2>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Satuan Pendidikan</label>
                                            <input type="text" value={formData.satuanPendidikan} onChange={e => setFormData({...formData, satuanPendidikan: e.target.value})} className="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Fase/Kelas</label>
                                                <input type="text" value={formData.faseKelas} onChange={e => setFormData({...formData, faseKelas: e.target.value})} className="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm" />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Jml Pertemuan</label>
                                                <input type="number" value={formData.jumlahPertemuan} onChange={e => setFormData({...formData, jumlahPertemuan: e.target.value})} className="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm" />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Topik Utama</label>
                                            <input type="text" value={formData.topik} onChange={e => setFormData({...formData, topik: e.target.value})} className="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm" />
                                        </div>
                                        
                                        <button onClick={generateRPP} disabled={loading} className="w-full py-3.5 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition-all flex items-center justify-center gap-3 disabled:bg-slate-300">
                                            {loading ? (
                                                <div className="flex items-center gap-2">
                                                    <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full loader"></div>
                                                    <span>Menyusun RPP...</span>
                                                </div>
                                            ) : (
                                                <><Icon name="send" /> Generate Sekarang</>
                                            )}
                                        </button>
                                        
                                        {error && (
                                            <div className="mt-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl flex gap-2">
                                                <Icon name="alert" size={16} className="shrink-0" />
                                                <span>{error}</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </aside>

                            {/* Panel Kanan: Hasil */}
                            <main className="lg:col-span-8">
                                {generatedRPP ? (
                                    <div className="bg-white rounded-xl shadow-lg border border-slate-200 rpp-container no-shadow" ref={rppRef}>
                                        <div className="p-8 md:p-12 whitespace-pre-wrap font-serif text-[11pt] text-black leading-relaxed">
                                            {/* Header Format RPP Resmi */}
                                            <div className="text-center mb-8 border-b-2 border-black pb-4 header-center">
                                                <h1 className="text-xl font-bold uppercase tracking-tight">Rencana Pelaksanaan Pembelajaran (DL)</h1>
                                                <h2 className="text-lg font-bold uppercase text-slate-700">{formData.satuanPendidikan}</h2>
                                                <p className="text-xs font-sans mt-1">Tahun Pelajaran: {formData.tahunPelajaran}</p>
                                            </div>
                                            
                                            <table className="w-full rpp-table mb-8 text-sm">
                                                <tbody>
                                                    <tr>
                                                        <td className="w-1/2"><strong>Mata Pelajaran:</strong> {formData.mataPelajaran}</td>
                                                        <td className="w-1/2"><strong>Fase/Kelas:</strong> {formData.faseKelas}</td>
                                                    </tr>
                                                    <tr>
                                                        <td><strong>Topik:</strong> {formData.topik}</td>
                                                        <td><strong>Alokasi Waktu:</strong> {formData.alokasiWaktu}</td>
                                                    </tr>
                                                </tbody>
                                            </table>

                                            <div className="prose prose-slate max-w-none">
                                                {/* Konten hasil generate akan tampil di sini */}
                                                <div dangerouslySetInnerHTML={{ __html: generatedRPP.replace(/\n/g, '<br/>') }} />
                                            </div>
                                            
                                            <div className="mt-12 flex justify-between text-center text-sm print:mt-20">
                                                <div>
                                                    <p>Mengetahui,</p>
                                                    <p className="mb-16">Kepala Sekolah</p>
                                                    <p className="font-bold underline">__________________________</p>
                                                    <p>NIP.</p>
                                                </div>
                                                <div>
                                                    <p>Saketi, ................. 2025</p>
                                                    <p className="mb-16">Guru Mata Pelajaran</p>
                                                    <p className="font-bold underline">__________________________</p>
                                                    <p>NIP.</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="h-[600px] border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center justify-center text-slate-300 p-8 text-center bg-white/50 print-hidden transition-all">
                                        <div className="p-6 bg-slate-50 rounded-full mb-6">
                                            <Icon name="book" size={64} className="opacity-20 text-indigo-600" />
                                        </div>
                                        <h3 className="text-xl font-semibold text-slate-400">Siap Membuat RPP Pembelajaran Mendalam?</h3>
                                        <p className="max-w-md text-sm mt-3 text-slate-400">
                                            Masukkan API Key Anda di panel samping, lengkapi identitas, lalu klik tombol generate untuk melihat hasilnya di sini.
                                        </p>
                                    </div>
                                )}
                            </main>
                        </div>
                    </div>
                    
                    <footer className="mt-12 text-center text-slate-400 text-[10px] print-hidden">
                        &copy; 2025 RPP-DL Generator Web App. Dikembangkan untuk kemajuan pendidikan Indonesia.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
